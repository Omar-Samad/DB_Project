{% extends "base.html" %}
{% block title %}Login — Lost & Found{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="card">
    <div class="page-header">
      <div class="page-title">Login</div>
      <div class="page-sub">Enter your credentials to continue</div>
    </div>
    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:6px;">Login</button>
    </form>
    <hr class="divider">
    <p style="text-align:center; font-size:14px; color:var(--muted);">
      Do not have an account?
      <a href="{{ url_for('register') }}" style="color:var(--primary); font-weight:500;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
