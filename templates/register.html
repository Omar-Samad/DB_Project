{% extends "base.html" %}
{% block title %}Register — Lost & Found{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="card">
    <div class="page-header">
      <div class="page-title">Create Account</div>
      <div class="page-sub">Fill in your details to register</div>
    </div>
    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" name="full_name" placeholder="Ahmed Khan" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="phone" placeholder="0300 1234567">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Choose a strong password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:6px;">Create Account</button>
    </form>
    <hr class="divider">
    <p style="text-align:center; font-size:14px; color:var(--muted);">
      Already have an account?
      <a href="{{ url_for('login') }}" style="color:var(--primary); font-weight:500;">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
